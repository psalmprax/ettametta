<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px; height: 720px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; overflow: hidden;
        }
        .badge { position: absolute; top: 30px; right: 30px; background: #fff; color: #00b894; padding: 10px 20px; border-radius: 25px; font-weight: 700; font-size: 16px; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 48px; font-weight: 800; text-align: center; margin-bottom: 15px; line-height: 1.2; }
        .subtitle { font-size: 22px; color: #55efc4; margin-bottom: 25px; }
        .price { font-size: 48px; font-weight: 800; margin-bottom: 20px; }
        .features { display: flex; gap: 30px; margin-top: 10px; }
        .feature { text-align: center; padding: 15px 25px; background: rgba(255,255,255,0.2); border-radius: 12px; }
        .feature .num { font-size: 32px; font-weight: 800; }
        .feature .label { font-size: 12px; color: #55efc4; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="badge">100 PROMPTS</div>
    <div class="icon">🎬</div>
    <h1>Content Creator<br>Prompts</h1>
    <p class="subtitle">YouTube, Blogs, Podcasts, Newsletters</p>
    <span class="price">$14.99</span>
    <div class="features">
        <div class="feature"><div class="num">25</div><div class="label">YouTube</div></div>
        <div class="feature"><div class="num">25</div><div class="label">Blog</div></div>
        <div class="feature"><div class="num">25</div><div class="label">Podcast</div></div>
        <div class="feature"><div class="num">25</div><div class="label">Newsletter</div></div>
    </div>
</body>
</html>
