<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 720px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #fff;
            color: #ee5a24;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.2;
        }
        .subtitle { font-size: 22px; color: #ffeaa7; margin-bottom: 25px; text-align: center; }
        .price { font-size: 48px; font-weight: 800; color: #fff; margin-bottom: 20px; }
        .features { display: flex; gap: 30px; margin-top: 10px; }
        .feature {
            text-align: center;
            padding: 15px 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
        }
        .feature .num { font-size: 32px; font-weight: 800; color: #fff; }
        .feature .label { font-size: 12px; color: #ffeaa7; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="badge">100 PROMPTS</div>
    <div class="icon">📱</div>
    <h1>Social Media<br>Prompts for Business</h1>
    <p class="subtitle">Never Run Out of Content Ideas</p>
    <span class="price">$12.99</span>
    <div class="features">
        <div class="feature"><div class="num">25</div><div class="label">Instagram</div></div>
        <div class="feature"><div class="num">25</div><div class="label">TikTok</div></div>
        <div class="feature"><div class="num">25</div><div class="label">LinkedIn</div></div>
        <div class="feature"><div class="num">25</div><div class="label">Twitter</div></div>
    </div>
</body>
</html>
