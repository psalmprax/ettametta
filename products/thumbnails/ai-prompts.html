<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 720px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #e17055;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 52px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff 0%, #74b9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 22px;
            color: #74b9ff;
            margin-bottom: 25px;
            text-align: center;
        }
        .price-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .price {
            font-size: 48px;
            font-weight: 800;
            color: #00cec9;
        }
        .features {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        .feature {
            text-align: center;
            padding: 15px 25px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .feature .num {
            font-size: 32px;
            font-weight: 800;
            color: #00cec9;
        }
        .feature .label {
            font-size: 12px;
            color: #b2bec3;
            text-transform: uppercase;
        }
        .corner-decor {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(0, 206, 201, 0.1);
        }
        .corner-decor.tl { top: -100px; left: -100px; }
        .corner-decor.br { bottom: -100px; right: -100px; }
    </style>
</head>
<body>
    <div class="corner-decor tl"></div>
    <div class="corner-decor br"></div>
    <div class="badge">BEST SELLER</div>
    <div class="icon">🤖</div>
    <h1>50 AI Prompts<br>for Business Owners</h1>
    <p class="subtitle">Stop Wasting Hours on Content Creation</p>
    <div class="price-box">
        <span class="price">$9.99</span>
    </div>
    <div class="features">
        <div class="feature"><div class="num">50</div><div class="label">Prompts</div></div>
        <div class="feature"><div class="num">5</div><div class="label">Categories</div></div>
        <div class="feature"><div class="num">10+</div><div class="label">Hrs Saved</div></div>
    </div>
</body>
</html>
