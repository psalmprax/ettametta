<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; overflow: hidden;
}
.badge { position: absolute; top: 40px; right: 40px; background: #fff; color: #ee5a24; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 18px; }
.icon { font-size: 100px; margin-bottom: 25px; }
h1 { font-size: 52px; font-weight: 800; text-align: center; margin-bottom: 15px; line-height: 1.15; }
.subtitle { font-size: 24px; color: #ffeaa7; margin-bottom: 30px; }
.price { font-size: 56px; font-weight: 800; margin-bottom: 25px; }
.features { display: flex; gap: 20px; }
.feature { text-align: center; padding: 18px 24px; background: rgba(255,255,255,0.2); border-radius: 14px; }
.feature .num { font-size: 36px; font-weight: 800; }
.feature .label { font-size: 13px; color: #ffeaa7; text-transform: uppercase; margin-top: 4px; }
</style></head><body>
<div class="badge">100 PROMPTS</div>
<div class="icon">📱</div>
<h1>Social Media<br>Prompts</h1>
<p class="subtitle">Never Run Out of Content Ideas</p>
<span class="price">$12.99</span>
<div class="features">
    <div class="feature"><div class="num">25</div><div class="label">Instagram</div></div>
    <div class="feature"><div class="num">25</div><div class="label">TikTok</div></div>
    <div class="feature"><div class="num">25</div><div class="label">LinkedIn</div></div>
    <div class="feature"><div class="num">25</div><div class="label">Twitter</div></div>
</div>
</body></html>
