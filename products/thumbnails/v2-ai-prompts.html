<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, #0c0c1e 0%, #1a1a3e 40%, #0f3460 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; overflow: hidden; position: relative;
}
.glow { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,206,201,0.15) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
.badge { position: absolute; top: 50px; right: 50px; background: linear-gradient(135deg, #e17055, #d63031); color: white; padding: 14px 28px; border-radius: 30px; font-weight: 800; font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(225,112,85,0.4); }
.icon { font-size: 90px; margin-bottom: 30px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); }
h1 { font-size: 62px; font-weight: 900; text-align: center; margin-bottom: 12px; line-height: 1.1; letter-spacing: -2px; }
h1 span { background: linear-gradient(90deg, #74b9ff, #00cec9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 22px; color: #74b9ff; margin-bottom: 35px; letter-spacing: 0.5px; }
.price-box { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
.price { font-size: 64px; font-weight: 900; background: linear-gradient(90deg, #00cec9, #55efc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.features { display: flex; gap: 16px; }
.feature { text-align: center; padding: 20px 30px; background: rgba(255,255,255,0.06); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
.feature .num { font-size: 36px; font-weight: 800; color: #00cec9; }
.feature .label { font-size: 12px; color: #74b9ff; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
.line { position: absolute; bottom: 80px; width: 200px; height: 3px; background: linear-gradient(90deg, transparent, #00cec9, transparent); }
</style></head><body>
<div class="glow"></div>
<div class="badge">BEST SELLER</div>
<div class="icon">🤖</div>
<h1>50 AI Prompts<br><span>for Business</span></h1>
<p class="subtitle">Stop Wasting Hours on Content Creation</p>
<div class="price-box"><span class="price">$9.99</span></div>
<div class="features">
    <div class="feature"><div class="num">50</div><div class="label">Prompts</div></div>
    <div class="feature"><div class="num">5</div><div class="label">Categories</div></div>
    <div class="feature"><div class="num">10+</div><div class="label">Hrs Saved</div></div>
</div>
<div class="line"></div>
</body></html>
