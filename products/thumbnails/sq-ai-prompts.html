<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; overflow: hidden; position: relative;
}
.badge { position: absolute; top: 40px; right: 40px; background: #e17055; color: white; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 18px; }
.icon { font-size: 100px; margin-bottom: 25px; }
h1 { font-size: 56px; font-weight: 800; text-align: center; margin-bottom: 15px; line-height: 1.15; }
.subtitle { font-size: 24px; color: #74b9ff; margin-bottom: 30px; text-align: center; }
.price { font-size: 56px; font-weight: 800; color: #00cec9; margin-bottom: 25px; }
.features { display: flex; gap: 20px; }
.feature { text-align: center; padding: 18px 28px; background: rgba(255,255,255,0.1); border-radius: 14px; border: 1px solid rgba(255,255,255,0.2); }
.feature .num { font-size: 36px; font-weight: 800; color: #00cec9; }
.feature .label { font-size: 13px; color: #b2bec3; text-transform: uppercase; margin-top: 4px; }
</style></head><body>
<div class="badge">BEST SELLER</div>
<div class="icon">🤖</div>
<h1>50 AI Prompts<br>for Business</h1>
<p class="subtitle">Stop Wasting Hours on Content</p>
<span class="price">$9.99</span>
<div class="features">
    <div class="feature"><div class="num">50</div><div class="label">Prompts</div></div>
    <div class="feature"><div class="num">5</div><div class="label">Categories</div></div>
    <div class="feature"><div class="num">10+</div><div class="label">Hrs Saved</div></div>
</div>
</body></html>
