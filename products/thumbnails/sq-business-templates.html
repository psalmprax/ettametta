<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; overflow: hidden;
}
.badge { position: absolute; top: 40px; right: 40px; background: #fff; color: #0984e3; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 18px; }
.icon { font-size: 100px; margin-bottom: 25px; }
h1 { font-size: 48px; font-weight: 800; text-align: center; margin-bottom: 15px; line-height: 1.15; }
.subtitle { font-size: 24px; color: #dfe6e9; margin-bottom: 30px; }
.price { font-size: 56px; font-weight: 800; margin-bottom: 25px; }
.features { display: flex; gap: 20px; }
.feature { text-align: center; padding: 18px 28px; background: rgba(255,255,255,0.2); border-radius: 14px; }
.feature .num { font-size: 36px; font-weight: 800; }
.feature .label { font-size: 13px; color: #dfe6e9; text-transform: uppercase; margin-top: 4px; }
</style></head><body>
<div class="badge">NOTION</div>
<div class="icon">📋</div>
<h1>Business<br>Templates</h1>
<p class="subtitle">15 Ready-to-Use Notion Templates</p>
<span class="price">$19.99</span>
<div class="features">
    <div class="feature"><div class="num">15</div><div class="label">Templates</div></div>
    <div class="feature"><div class="num">5</div><div class="label">Min Each</div></div>
    <div class="feature"><div class="num">$200</div><div class="label">Saved/Mo</div></div>
</div>
</body></html>
