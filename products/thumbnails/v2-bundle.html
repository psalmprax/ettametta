<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, #0a0a0f 0%, #2d2d3d 40%, #4a4a5a 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; overflow: hidden; position: relative;
}
.glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(253,203,110,0.15) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
.badge { position: absolute; top: 50px; right: 50px; background: linear-gradient(135deg, #e17055, #d63031); color: white; padding: 14px 28px; border-radius: 30px; font-weight: 800; font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(225,112,85,0.5); }
.icon { font-size: 100px; margin-bottom: 25px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4)); }
h1 { font-size: 56px; font-weight: 900; text-align: center; margin-bottom: 12px; line-height: 1.1; letter-spacing: -2px; background: linear-gradient(90deg, #fdcb6e, #e17055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 22px; color: #b2bec3; margin-bottom: 25px; }
.price-row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
.price-old { font-size: 32px; color: #636e72; text-decoration: line-through; }
.price { font-size: 72px; font-weight: 900; background: linear-gradient(90deg, #fdcb6e, #ffeaa7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.discount { background: linear-gradient(135deg, #e17055, #d63031); color: white; padding: 12px 24px; border-radius: 24px; font-weight: 800; font-size: 18px; }
.features { display: flex; gap: 14px; }
.feature { text-align: center; padding: 18px 24px; background: rgba(255,255,255,0.06); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); }
.feature .num { font-size: 32px; font-weight: 800; color: #fdcb6e; }
.feature .label { font-size: 11px; color: #b2bec3; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
.line { position: absolute; bottom: 80px; width: 200px; height: 3px; background: linear-gradient(90deg, transparent, #fdcb6e, transparent); }
</style></head><body>
<div class="glow"></div>
<div class="badge">37% OFF</div>
<div class="icon">📦</div>
<h1>AI Prompt Mega Bundle</h1>
<p class="subtitle">325 Prompts for Everything</p>
<div class="price-row">
    <span class="price-old">$47.96</span>
    <span class="price">$29.99</span>
    <span class="discount">SAVE $18</span>
</div>
<div class="features">
    <div class="feature"><div class="num">50</div><div class="label">Business</div></div>
    <div class="feature"><div class="num">100</div><div class="label">Social</div></div>
    <div class="feature"><div class="num">75</div><div class="label">Email</div></div>
    <div class="feature"><div class="num">100</div><div class="label">Content</div></div>
</div>
<div class="line"></div>
</body></html>
