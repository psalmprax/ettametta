<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1080px; height: 1080px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, #1a0510 0%, #4a1030 40%, #e84393 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: white; overflow: hidden; position: relative;
}
.glow { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(232,67,147,0.3) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
.badge { position: absolute; top: 50px; right: 50px; background: linear-gradient(135deg, #fd79a8, #e84393); color: white; padding: 14px 28px; border-radius: 30px; font-weight: 800; font-size: 16px; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(232,67,147,0.5); }
.icon { font-size: 90px; margin-bottom: 30px; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3)); }
h1 { font-size: 56px; font-weight: 900; text-align: center; margin-bottom: 12px; line-height: 1.1; letter-spacing: -2px; }
h1 span { background: linear-gradient(90deg, #fd79a8, #ffeaa7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 22px; color: #fd79a8; margin-bottom: 35px; }
.price { font-size: 64px; font-weight: 900; background: linear-gradient(90deg, #fd79a8, #ffeaa7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
.features { display: flex; gap: 16px; }
.feature { text-align: center; padding: 20px 28px; background: rgba(255,255,255,0.08); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
.feature .num { font-size: 34px; font-weight: 800; color: #fd79a8; }
.feature .label { font-size: 12px; color: #ffeaa7; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; }
.line { position: absolute; bottom: 80px; width: 200px; height: 3px; background: linear-gradient(90deg, transparent, #fd79a8, transparent); }
</style></head><body>
<div class="glow"></div>
<div class="badge">EBOOK</div>
<div class="icon">📚</div>
<h1>AI Business<br><span>Automation Guide</span></h1>
<p class="subtitle">Save 20+ Hours Per Week</p>
<span class="price">$24.99</span>
<div class="features">
    <div class="feature"><div class="num">50+</div><div class="label">Pages</div></div>
    <div class="feature"><div class="num">8</div><div class="label">Chapters</div></div>
    <div class="feature"><div class="num">50</div><div class="label">Workflows</div></div>
</div>
<div class="line"></div>
</body></html>
