version: '3'
services:
  # Dify API Server
  dify-api:
    image: langgenius/dify-api:0.6.11
    container_name: ettametta-dify-api
    restart: always
    environment:
      - DB_USERNAME=${POSTGRES_USER:-psalmprax}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ettametta_pass}
      - DB_HOST=ettametta-db-1
      - DB_DATABASE=dify
      - REDIS_HOST=ettametta-redis-1
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ettametta_redis_pass}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@ettametta-redis-1:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@ettametta-redis-1:6379/1
      - SECRET_KEY=${SECRET_KEY:-ettametta_dify_secret_key_v1}
      - CONSOLE_CORS_ALLOW_ORIGIN=*
      - WEB_API_CORS_ALLOW_ORIGIN=*
      - CORS_ALLOW_ORIGINS=*
      - QDRANT_HOST=ettametta-qdrant
      - QDRANT_PORT=6333
      - VECTOR_STORE=qdrant
    networks:
      - ettametta

  # Dify Worker
  dify-worker:
    image: langgenius/dify-api:0.6.11
    container_name: ettametta-dify-worker
    restart: always
    command: /usr/bin/supervisord
    environment:
      - DB_USERNAME=${POSTGRES_USER:-psalmprax}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ettametta_pass}
      - DB_HOST=ettametta-db-1
      - DB_DATABASE=dify
      - REDIS_HOST=ettametta-redis-1
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ettametta_redis_pass}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@ettametta-redis-1:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@ettametta-redis-1:6379/1
      - SECRET_KEY=${SECRET_KEY:-ettametta_dify_secret_key_v1}
      - CONSOLE_CORS_ALLOW_ORIGIN=*
      - WEB_API_CORS_ALLOW_ORIGIN=*
      - CORS_ALLOW_ORIGINS=*
      - CONSOLE_CORS_ALLOW_ORIGIN=*
      - WEB_API_CORS_ALLOW_ORIGIN=*
    networks:
      - ettametta

  # Dify Web Interface
  dify-web:
    image: langgenius/dify-web:0.6.11
    container_name: ettametta-dify-web
    restart: always
    ports:
      - "8081:3000"
    environment:
      - CONSOLE_API_URL=http://149.104.110.122.sslip.io:7200/api/v1/dify
      - APP_API_URL=http://149.104.110.122.sslip.io:7200/api/v1/dify
    networks:
      - ettametta

networks:
  ettametta:
    external: true
    name: ettametta_default
