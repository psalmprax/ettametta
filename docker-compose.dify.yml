version: '3'
services:
  # Dify API Server
  dify-api:
    image: langgenius/dify-api:0.6.11
    container_name: ettametta-dify-api
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DB_USERNAME=${POSTGRES_USER:?}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?}
      - DB_HOST=db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - SECRET_KEY=${DIFY_INNER_SECRET_KEY:?}
      - CONSOLE_CORS_ALLOW_ORIGIN=${DIFY_CORS_ORIGIN}
      - WEB_API_CORS_ALLOW_ORIGIN=${DIFY_CORS_ORIGIN}
      - CORS_ALLOW_ORIGINS=${DIFY_CORS_ORIGIN}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - GUNICORN_TIMEOUT=600
    volumes:
      - dify_storage:/app/api/storage
    networks:
      - ettametta

  # Dify Worker
  dify-worker:
    image: langgenius/dify-api:0.6.11
    container_name: ettametta-dify-worker
    restart: always
    command: /usr/bin/supervisord
    environment:
      - MODE=worker
      - DB_USERNAME=${POSTGRES_USER:?}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?}
      - DB_HOST=db
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/1
      - SECRET_KEY=${DIFY_INNER_SECRET_KEY:?}
      - CONSOLE_CORS_ALLOW_ORIGIN=${DIFY_CORS_ORIGIN}
      - WEB_API_CORS_ALLOW_ORIGIN=${DIFY_CORS_ORIGIN}
      - CORS_ALLOW_ORIGINS=${DIFY_CORS_ORIGIN}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - GUNICORN_TIMEOUT=600
    volumes:
      - dify_storage:/app/api/storage
    networks:
      - ettametta

  # Dify Web Interface
  dify-web:
    image: langgenius/dify-web:0.6.11
    container_name: ettametta-dify-web
    restart: always
    ports:
      - "8081:3000"
    environment:
      - CONSOLE_API_URL=${DIFY_CONSOLE_API_URL}
      - APP_API_URL=${DIFY_APP_API_URL}
    networks:
      - ettametta

networks:
  ettametta:
    external: true
    name: ettametta_default

volumes:
  dify_storage:
