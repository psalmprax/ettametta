events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver - automatically resolves container hostnames
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket Upgrade Map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Relaxed rate limiting zone for production dashboard polling
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    server {
        listen 80;
        server_name 149.104.110.122.sslip.io;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.ibytedtos.com https://*.tiktokcdn.com https://*.tiktokcdn-us.com https://*.tiktok.com https://*.ttwstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self' ws: wss: https://149.104.110.122 ws://149.104.110.122 http://130.61.26.105:3000 ws://130.61.26.105:3000 ws://130.61.26.105:8000 http://localhost:3000 ws://localhost:3000 http://localhost:8000 ws://localhost:8000 https://cdn.jsdelivr.net https://*.jsdelivr.net https://*.tiktok.com; frame-src 'self' https://*.tiktok.com https://*.tiktokcdn.com;" always;

        # WebSocket Handler - direct path (frontend connects to /ws/...)
        location /ws/ {
            proxy_pass http://api:8000/ws/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket Handler - alternate /api/ws/ path
        location /api/ws/ {
            proxy_pass http://api:8000/ws/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Standard API Handler (Rate Limited)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            # Forward full path (including /api/) to FastAPI
            proxy_pass http://api:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Longer timeout for slow endpoints (discovery, analysis)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # AI Gateway Handler - Unified via port 7200
        location /ai-gateway/ {
            rewrite ^/ai-gateway/(.*) /$1 break;
            proxy_pass http://ai-gateway:8133;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Next.js static assets (content-hashed, cache forever)
        location /_next/static/ {
            proxy_pass http://dashboard:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Dashboard - Fallback (no cache for HTML pages)
        location / {
            proxy_pass http://dashboard:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    server {
        listen 443 ssl;
        server_name 149.104.110.122.sslip.io;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Optimization for SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        # security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.ibytedtos.com https://*.tiktokcdn.com https://*.tiktokcdn-us.com https://*.tiktok.com https://*.ttwstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self' ws: wss: https://149.104.110.122 ws://149.104.110.122 http://130.61.26.105:3000 ws://130.61.26.105:3000 ws://130.61.26.105:8000 http://localhost:3000 ws://localhost:3000 http://localhost:8000 ws://localhost:8000 https://cdn.jsdelivr.net https://*.jsdelivr.net https://*.tiktok.com http://149.104.110.122.sslip.io:7200; frame-src 'self' https://*.tiktok.com https://*.tiktokcdn.com;" always;

        # WebSocket Handler - direct path
        location /ws/ {
            proxy_pass http://api:8000/ws/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket Handler - alternate /api/ws/ path
        location /api/ws/ {
            proxy_pass http://api:8000/ws/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Standard API Handler
        location /api/ {
            proxy_pass http://api:8000;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # AI Gateway Handler - Unified via port 7200
        location /ai-gateway/ {
            rewrite ^/ai-gateway/(.*) /$1 break;
            proxy_pass http://ai-gateway:8133;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://dashboard:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Dashboard Fallback
        location / {
            proxy_pass http://dashboard:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
