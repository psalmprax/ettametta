services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "7216:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psalmprax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ettametta_pass}
      POSTGRES_DB: ettametta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psalmprax} -d ettametta"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-ettametta_redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ettametta_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
        - BASE_IMAGE=python:3.11-slim

    ports:
      - "7201:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --log-level debug --timeout-keep-alive 600
    restart: always
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - .:/app
      - ./data/storage/outputs:/app/data/storage/outputs
      - /app/apps/remotion-studio/node_modules
    environment:
      - ENV=development
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      # Pass-through credentials
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TIKTOK_CLIENT_KEY
      - TIKTOK_CLIENT_SECRET
      - PRODUCTION_DOMAIN
      - YOUTUBE_API_KEY
      - TIKTOK_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - PEXELS_API_KEY
      - GROQ_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_STORAGE_BUCKET_NAME
      - SECRET_KEY
      - INTERNAL_API_TOKEN
      - RENDER_NODE_URL
      - AI_CLUSTER_SECRET=${AI_CLUSTER_SECRET:-psalm_cluster_v1}
      - CORS_ORIGINS
      - OLLAMA_MODEL
      - OLLAMA_URL=http://ollama:11434

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://${API_HOST:-92.209.217.18}.sslip.io:7200/api/v1
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
        - BASE_IMAGE=python:3.11-slim
    command: celery -A src.api.utils.celery worker --loglevel=info --concurrency=1
    restart: always
    env_file: .env
    volumes:
      - .:/app
      - ./data/storage/outputs:/app/data/storage/outputs
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - PYTHONPATH=/app
      - ENV=development
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: [ "CMD", "python", "-c", "import psutil; exit(0 if any('celery' in p.name().lower() for p in psutil.process_iter()) else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ettametta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
        - BASE_IMAGE=python:3.11-slim

    command: celery -A src.api.utils.celery beat --loglevel=info
    restart: always
    env_file: .env
    volumes:
      - .:/app
    environment:
      - ENV=development
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - SECRET_KEY
      - INTERNAL_API_TOKEN
    healthcheck:
      test: [ "CMD", "python", "-c", "import psutil; exit(0 if any('celery' in p.name().lower() for p in psutil.process_iter()) else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "7200:80"
      - "7213:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  openclaw:
    build:
      context: .
      dockerfile: ./infra/docker/openclaw.Dockerfile
    image: ettametta-openclaw
    ports:
      - "7217-7219:3001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - API_URL=http://api:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - PORT=3001
    volumes:
      - .:/app
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  node-skills:
    image: node:18-alpine
    volumes:
      - ./apps/external-skills:/app
    working_dir: /app
    command: /bin/sh -c "npm install && npm start"
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  ai-gateway:
    build:
      context: .
      dockerfile: ./infra/docker/gatekeeper.Dockerfile
    image: ettametta-ai-gateway
    ports:
      - "8133:8133"
    environment:
      - AI_NODES=${AI_NODES:-""}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - AI_CLUSTER_SECRET=${AI_CLUSTER_SECRET:-psalm_cluster_v1}
    volumes:
      - ./src/engines/remote_ai_setup:/app
      - gateway_data:/workspace
    restart: always

  voiceover:
    profiles:
      - optional
    build:
      context: .
      dockerfile: ./infra/docker/voiceover.Dockerfile
    ports:
      - "7207:8080"
    environment:
      - DEVICE=cpu
    volumes:
      - ./src/services/voiceover:/app
      - voiceover_cache:/app/cache
    deploy:
      replicas: 0

  video_processor:
    profiles:
      - video  # Enable with: docker-compose --profile video up
    build:
      context: .
      dockerfile: ./infra/docker/video_processor.Dockerfile
      args:
        - BASE_IMAGE=python:3.10-slim
    ports:
      - "7206:8001"
    volumes:
      - .:/app
      - ./data/storage/outputs:/app/data/storage/outputs
      - ./data/storage/inputs:/app/data/storage/inputs
      - video_cache:/app/cache
    environment:
      - ENV=development
      - PYTHONPATH=/app
      # Video processing environment
      - TORCH_USE_CUDA_DSA=1
      - CUDA_VISIBLE_DEVICES=all
      # API keys for video processing
      - YOUTUBE_API_KEY
      - GROQ_API_KEY
      - OPENAI_API_KEY
      - PEXELS_API_KEY
      - ELEVENLABS_API_KEY
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: >
      bash -c "
      echo '🎬 Video Processor Ready'
      echo 'Available functions:'
      echo '- scene_based_orchestrator.produce_scene_based_video()'
      echo '- Generates real MP4 files with MoviePy/FFmpeg/OpenCV'
      echo '- Outputs to: /app/outputs/scene_based_videos/'
      echo ''
      echo 'Example usage:'
      echo 'scenes = ['
      echo \"  {'description': 'Intro to topic', 'visual_prompt': 'Modern workspace'},\"      echo \"  {'description': 'Main demonstration', 'visual_prompt': 'Step-by-step guide'}\"      echo ']'
      echo '# result = await scene_based_orchestrator.produce_scene_based_video(scenes=scenes, niche=\"your_topic\")'
      echo 'Ready for video production commands...'
      echo ''
      echo 'To run video production:'
      echo 'docker-compose --profile video exec video_processor python3 -c \"'
      echo 'import asyncio'
      echo 'from services.video_engine.scene_orchestrator import scene_based_orchestrator'
      echo ''
      echo 'scenes = [{\"description\": \"Intro to AI\", \"visual_prompt\": \"Modern workspace\"}]'
      echo 'result = asyncio.run(scene_based_orchestrator.produce_scene_based_video(scenes=scenes, niche=\"AI tools\"))'
      echo 'print(f\"Video created: {result.get(\\\"video_path\\\")}\")'
      echo '\"'
      "
    restart: unless-stopped

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "7208:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "7209:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "7210:9100"
    restart: unless-stopped

#  gpu-exporter:
#    image: utkuozdemir/nvidia_gpu_exporter:latest
#    ports:
#      - "7211:9835"
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [gpu]
#    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ettametta-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.10
    user: "0:0"
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "7212:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  voiceover_cache:
  video_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  gateway_data:
  ollama_data:
  qdrant_data:
