networks:
  viral_forge:
    driver: bridge

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "7216:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"
    networks:
      - viral_forge
  api:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
        - BASE_IMAGE=python:3.10-slim

    ports:
      - "7201:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - viral_forge
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --log-level debug
    restart: always
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - .:/app
      - ./data/storage/outputs:/app/data/storage/outputs
      - /app/apps/remotion-studio/node_modules
    environment:
      - ENV=development
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      # Pass-through credentials
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TIKTOK_CLIENT_KEY
      - TIKTOK_CLIENT_SECRET
      - PRODUCTION_DOMAIN
      - YOUTUBE_API_KEY
      - TIKTOK_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - PEXELS_API_KEY
      - GROQ_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_STORAGE_BUCKET_NAME
      - SECRET_KEY
      - INTERNAL_API_TOKEN
      - RENDER_NODE_URL
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-psalmprax}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ettametta_pass}
      - POSTGRES_DB=${POSTGRES_DB:-ettametta}
    ports:
      - "7203:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - viral_forge

  discovery-go:
    build: 
      context: ./sr./src/services/discovery-go
      dockerfile: ../../../infra/docker/discovery-go.Dockerfile
    ports:
      - "7205:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - YOUTUBE_API_KEY
    networks:
      - viral_forge

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://149.104.110.122.sslip.io:7200/api/v1}
        - NEXT_PUBLIC_API_PORT=7200
        - NEXT_PUBLIC_INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
        - NEXT_PUBLIC_AI_GATEWAY_URL=http://149.104.110.122.sslip.io:7200/ai-gateway
    ports:
      - "7202:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://149.104.110.122.sslip.io:7200/api/v1}
      - NEXT_PUBLIC_API_PORT=7200
      - API_INTERNAL_URL=http://api:8000
      - NEXT_PUBLIC_INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - viral_forge

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-ettametta_redis_pass}
    ports:
      - "7204:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ettametta_redis_pass}
    networks:
      - viral_forge

  celery_worker:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
        - BASE_IMAGE=python:3.10-slim

    command: celery -A api.utils.celery worker --loglevel=info --concurrency=2
    restart: always
    env_file: .env
    volumes:
      - .:/app
      - ./data/storage/outputs:/app/data/storage/outputs
      - /app/apps/remotion-studio/node_modules
    environment:
      - ENV=development
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      # Video model quantization (fp16, int8, int4) - reduces VRAM usage
      - LTX_QUANTIZATION=${LTX_QUANTIZATION:-fp16}
      - HUNYUAN_QUANTIZATION=${HUNYUAN_QUANTIZATION:-fp16}
      - COGVIDEO_QUANTIZATION=${COGVIDEO_QUANTIZATION:-fp16}
      # Pass-through credentials
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - TIKTOK_CLIENT_KEY
      - TIKTOK_CLIENT_SECRET
      - PRODUCTION_DOMAIN
      - YOUTUBE_API_KEY
      - TIKTOK_API_KEY
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - PEXELS_API_KEY
      - GROQ_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - AWS_STORAGE_BUCKET_NAME
      - SECRET_KEY
      - INTERNAL_API_TOKEN
      - RENDER_NODE_URL
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - db
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    networks:
      - viral_forge

  celery_beat:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
        - BASE_IMAGE=python:3.10-slim

    command: celery -A api.utils.celery beat --loglevel=info
    restart: always
    env_file: .env
    volumes:
      - .:/app
    environment:
      - ENV=development
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://${POSTGRES_USER:-psalmprax}:${POSTGRES_PASSWORD:-ettametta_pass}@db:5432/ettametta
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ettametta_redis_pass}@redis:6379/0
      - SECRET_KEY
      - INTERNAL_API_TOKEN
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - db
    networks:
      - viral_forge

  nginx:
    image: nginx:alpine
    ports:
      - "7200:80"
      - "7213:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - viral_forge

  openclaw:
    build:
      context: .
      dockerfile: ./infra/docker/openclaw.Dockerfile
    image: viral_forge-openclaw
    ports:
      - "7214:3001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
      - API_URL=http://nginx/api/v1
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    networks:
      - viral_forge
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  node-skills:
    image: node:18-alpine
    volumes:
      - ./apps/external-skills:/app
    working_dir: /app
    command: /bin/sh -c "npm install && npm start"
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - viral_forge

  ai-gateway:
    build:
      context: .
      dockerfile: ./infra/docker/gatekeeper.Dockerfile
    image: viral_forge-ai-gateway
    ports:
      - "8133:8133"
    environment:
      - AI_NODES=${AI_NODES:-""}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - AI_CLUSTER_SECRET=${AI_CLUSTER_SECRET:-"viral_forge_neural_default_secret"}
    volumes:
      - ./src/engines/remote_ai_setup:/app
      - gateway_data:/workspace
    restart: always
    networks:
      - viral_forge

  voiceover:
    profiles:
      - optional
    build:
      context: .
      dockerfile: ./infra/docker/voiceover.Dockerfile
    ports:
      - "7207:8080"
    environment:
      - DEVICE=cpu
    volumes:
      - ./src/services/voiceover:/app
      - voiceover_cache:/app/cache
    deploy:
      replicas: 0
    networks:
      - viral_forge

  video_processor:
    profiles:
      - video  # Enable with: docker-compose --profile video up
    build:
      context: .
      dockerfile: ./infra/docker/video_processor.Dockerfile
      args:
        - BASE_IMAGE=python:3.10-slim
    ports:
      - "7206:8001"
    volumes:
      - .:/app
      - ./data/storage/outputs:/app/data/storage/outputs
      - ./data/storage/inputs:/app/data/storage/inputs
      - video_cache:/app/cache
    environment:
      - ENV=development
      - PYTHONPATH=/app/src
      # Video processing environment
      - TORCH_USE_CUDA_DSA=1
      - CUDA_VISIBLE_DEVICES=all
      # API keys for video processing
      - YOUTUBE_API_KEY
      - GROQ_API_KEY
      - OPENAI_API_KEY
      - PEXELS_API_KEY
      - ELEVENLABS_API_KEY
    networks:
      - viral_forge
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: >
      bash -c "
      echo '🎬 Video Processor Ready'
      echo 'Available functions:'
      echo '- scene_based_orchestrator.produce_scene_based_video()'
      echo '- Generates real MP4 files with MoviePy/FFmpeg/OpenCV'
      echo '- Outputs to: /app/outputs/scene_based_videos/'
      echo ''
      echo 'Example usage:'
      echo 'scenes = ['
      echo \"  {'description': 'Intro to topic', 'visual_prompt': 'Modern workspace'},\"      echo \"  {'description': 'Main demonstration', 'visual_prompt': 'Step-by-step guide'}\"      echo ']'
      echo '# result = await scene_based_orchestrator.produce_scene_based_video(scenes=scenes, niche=\"your_topic\")'
      echo 'Ready for video production commands...'
      echo ''
      echo 'To run video production:'
      echo 'docker-compose --profile video exec video_processor python3 -c \"'
      echo 'import asyncio'
      echo 'from services.video_engine.scene_orchestrator import scene_based_orchestrator'
      echo ''
      echo 'scenes = [{\"description\": \"Intro to AI\", \"visual_prompt\": \"Modern workspace\"}]'
      echo 'result = asyncio.run(scene_based_orchestrator.produce_scene_based_video(scenes=scenes, niche=\"AI tools\"))'
      echo 'print(f\"Video created: {result.get(\\\"video_path\\\")}\")'
      echo '\"'
      "
    restart: unless-stopped

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "7208:9090"
    restart: unless-stopped
    networks:
      - viral_forge

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "7209:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - viral_forge

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "7210:9100"
    restart: unless-stopped
    networks:
      - viral_forge

   # gpu-exporter:
   #   image: utkuozdemir/nvidia_gpu_exporter:latest
   #   ports:
   #     - "7211:9835"
   #   deploy:
   #     resources:
   #       reservations:
   #         devices:
   #           - driver: nvidia
   #             count: all
   #             capabilities: [gpu]
   #   restart: unless-stopped

  loki:
    image: grafana/loki:2.9.10
    user: "0:0"
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "7212:3100"
    restart: unless-stopped
    networks:
      - viral_forge

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - viral_forge

volumes:
  postgres_data:
  voiceover_cache:
  video_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  gateway_data:
