services:
  traefik:
    image: traefik:v3.7
    command:
    - --api.insecure=false
    - --api.dashboard=true
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --entrypoints.websecure.address=:443
    - --log.level=DEBUG
    - --ping=true
    ports:
    - 80:80
    - 443:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
    - default
    - ag-network
    labels:
    - traefik.enable=true
    - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
    - traefik.http.routers.traefik.service=api@internal
    - traefik.http.routers.traefik.entrypoints=web
    - traefik.http.routers.traefik.middlewares=traefik-auth
    - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS:?TRAEFIK_DASHBOARD_USERS is required. Generate via: htpasswd -nb admin <password>. Refusing to start with a default/placeholder password.}"
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required. Set in .env or environment. Refusing to start with a placeholder.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Set in
        .env or environment}
      POSTGRES_DB: ettametta
    ports:
    - 7203:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ettametta
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: always
    ports:
    - 7204:6379
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required.
      Set in .env or environment}
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD:?}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
      - BASE_IMAGE=python:3.11-slim
    ports:
    - 7201:8000
    labels:
    - traefik.enable=true
    - traefik.http.routers.api.rule=Host(`api.localhost`)
    - traefik.http.routers.api.service=api
    - traefik.http.routers.api.entrypoints=web
    - traefik.http.services.api.loadbalancer.server.port=8000
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --log-level debug
      --timeout-keep-alive 600
    restart: always
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fL http://localhost:8000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
    - .:/app
    - ./data/storage/outputs:/app/data/storage/outputs
    - /app/apps/remotion-studio/node_modules
    environment:
    - ENV=development
    - PYTHONPATH=/app
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?}@db:5432/ettametta
    - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - TIKTOK_CLIENT_KEY
    - TIKTOK_CLIENT_SECRET
    - PRODUCTION_DOMAIN
    - YOUTUBE_API_KEY
    - TIKTOK_API_KEY
    - OPENAI_API_KEY
    - ELEVENLABS_API_KEY
    - PEXELS_API_KEY
    - GROQ_API_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - AWS_STORAGE_BUCKET_NAME
    - SECRET_KEY
    - INTERNAL_API_TOKEN
    - RENDER_NODE_URL
    - AI_CLUSTER_SECRET=${AI_CLUSTER_SECRET:?AI_CLUSTER_SECRET is required. Set in
      .env or environment}
    - CORS_ORIGINS
    - OLLAMA_MODEL
    - OLLAMA_URL=http://ettametta-ollama:11434
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    environment:
    - NEXT_PUBLIC_API_URL=http://${API_HOST:-92.209.217.18}.sslip.io:7200/api/v1
    restart: always
  celery_worker:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
      - BASE_IMAGE=python:3.11-slim
    command: celery -A src.api.utils.celery worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    restart: always
    env_file: .env
    volumes:
    - .:/app
    - ./data/storage/outputs:/app/data/storage/outputs
    depends_on:
    - redis
    - db
    environment:
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?}@db:5432/ettametta
    - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - PYTHONPATH=/app
    - ENV=development
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import psutil; exit(0 if any('celery' in p.name().lower() for p in psutil.process_iter())
        else 1)
      interval: 30s
      timeout: 10s
      retries: 3
  ollama:
    image: ollama/ollama:latest
    container_name: ettametta-ollama
    ports:
    - 11434:11434
    volumes:
    - ollama_data:/root/.ollama
    environment:
    - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:11434/ > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  celery_beat:
    build:
      context: .
      dockerfile: ./infra/docker/api.Dockerfile
      args:
      - BASE_IMAGE=python:3.11-slim
    command: celery -A src.api.utils.celery beat --loglevel=info
    restart: always
    env_file: .env
    volumes:
    - .:/app
    environment:
    - ENV=development
    - PYTHONPATH=/app
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?}@db:5432/ettametta
    - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - REDIS_URL=redis://:${REDIS_PASSWORD:?}@redis:6379/0
    - SECRET_KEY
    - INTERNAL_API_TOKEN
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import psutil; exit(0 if any('celery' in p.name().lower() for p in psutil.process_iter())
        else 1)
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
    - redis
    - db
  nginx:
    image: nginx:alpine
    ports:
    - 7200:80
    - 7213:443
    volumes:
    - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:80/ > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  openclaw:
    build:
      context: .
      dockerfile: ./infra/docker/openclaw.Dockerfile
    image: ettametta-openclaw
    ports:
    - 7217-7219:3001
    environment:
    - GROQ_API_KEY=${GROQ_API_KEY}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    - PEXELS_API_KEY=${PEXELS_API_KEY}
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
    - OLLAMA_BASE_URL=http://ettametta-ollama:11434
    - OLLAMA_URL=http://ettametta-ollama:11434
    - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?}@db:5432/ettametta
    - API_URL=http://api:8000
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    - PORT=3001
    volumes:
    - .:/app
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
  node-skills:
    image: node:18-alpine
    volumes:
    - ./apps/external-skills:/app
    working_dir: /app
    command: /bin/sh -c "npm install && npm start"
    ports:
    - 3002:3002
    environment:
    - NODE_ENV=production
    depends_on:
    - api
    restart: unless-stopped
  ai-gateway:
    build:
      context: .
      dockerfile: ./infra/docker/gatekeeper.Dockerfile
    image: ettametta-ai-gateway
    ports:
    - 8133:8133
    environment:
    - AI_NODES=${AI_NODES:-""}
    - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    - AI_CLUSTER_SECRET=${AI_CLUSTER_SECRET:?AI_CLUSTER_SECRET is required. Set in
      .env or environment}
    volumes:
    - ./src/engines/remote_ai_setup:/app
    - gateway_data:/workspace
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8133/health > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  video_processor:
    profiles:
    - video
    build:
      context: .
      dockerfile: ./infra/docker/video_processor.Dockerfile
      args:
      - BASE_IMAGE=python:3.10-slim
    ports:
    - 7206:8001
    volumes:
    - .:/app
    - ./data/storage/outputs:/app/data/storage/outputs
    - ./data/storage/inputs:/app/data/storage/inputs
    - video_cache:/app/cache
    environment:
    - ENV=development
    - PYTHONPATH=/app
    - TORCH_USE_CUDA_DSA=1
    - CUDA_VISIBLE_DEVICES=all
    - YOUTUBE_API_KEY
    - GROQ_API_KEY
    - OPENAI_API_KEY
    - PEXELS_API_KEY
    - ELEVENLABS_API_KEY
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: 'bash -c " echo ''🎬 Video Processor Ready'' echo ''Available functions:''
      echo ''- scene_based_orchestrator.produce_scene_based_video()'' echo ''- Generates
      real MP4 files with MoviePy/FFmpeg/OpenCV'' echo ''- Outputs to: /app/outputs/scene_based_videos/''
      echo '''' echo ''Example usage:'' echo ''scenes = ['' echo \"  {''description'':
      ''Intro to topic'', ''visual_prompt'': ''Modern workspace''},\"      echo \"  {''description'':
      ''Main demonstration'', ''visual_prompt'': ''Step-by-step guide''}\"      echo
      '']'' echo ''# result = await scene_based_orchestrator.produce_scene_based_video(scenes=scenes,
      niche=\"your_topic\")'' echo ''Ready for video production commands...'' echo
      '''' echo ''To run video production:'' echo ''docker-compose --profile video
      exec video_processor python3 -c \"'' echo ''import asyncio'' echo ''from services.video_engine.scene_orchestrator
      import scene_based_orchestrator'' echo '''' echo ''scenes = [{\"description\":
      \"Intro to AI\", \"visual_prompt\": \"Modern workspace\"}]'' echo ''result =
      asyncio.run(scene_based_orchestrator.produce_scene_based_video(scenes=scenes,
      niche=\"AI tools\"))'' echo ''print(f\"Video created: {result.get(\\\"video_path\\\")}\")''
      echo ''\"'' "

      '
    restart: unless-stopped
  cloakbrowser:
    build:
      context: ./src/services/cloakbrowser
      dockerfile: Dockerfile
    image: ettametta-cloakbrowser
    ports:
    - 8010:8010
    networks:
      default:
        aliases:
        - discovery-scraper
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    environment:
    - PYTHONUNBUFFERED=1
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ettametta-qdrant
    ports:
    - 6333:6333
    - 6334:6334
    volumes:
    - qdrant_data:/qdrant/storage
    restart: unless-stopped
volumes:
  postgres_data: null
  redis_data: null
  voiceover_cache: null
  video_cache: null
  prometheus_data: null
  grafana_data: null
  loki_data: null
  gateway_data: null
  ollama_data: null
  qdrant_data: null
networks:
  default: null
  ag-network:
    name: ag-network
    external: true
