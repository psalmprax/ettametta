version: '3.8'

# Note: Ollama runs Bare Metal on port 11434 for performance.
# Models are downloaded directly on the host.
# To manage: curl http://localhost:11434/api/...

services:
  # Ollama runs bare metal for best CPU performance.
  # Use 'docker run --network host' if running in container later.
  ollama:
    image: ollama/ollama:latest
    container_name: ettametta-ollama
    restart: unless-stopped