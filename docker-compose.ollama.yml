version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ettametta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
    restart: unless-stopped
    networks:
      - ettametta_viral_forge

volumes:
  ollama_data:
    driver: local

networks:
  ettametta_viral_forge:
    external: true