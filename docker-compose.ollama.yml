services:
  ollama:
    image: ollama/ollama:latest
    container_name: ettametta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
    restart: unless-stopped
    network_mode: host

volumes:
  ollama_data:
    driver: local