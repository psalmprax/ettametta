# OWASP Core Rule Set Configuration for ettametta
# Based on CRS v4.0

SecRuleEngine On

# Request body handling
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Response body handling
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# Temp files
SecTmpDir /tmp/
SecDataDir /tmp/

# Audit logging
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log

# Debug log (0=off, 9=verbose)
SecDebugLog /var/log/nginx/modsec_debug.log
SecDebugLogLevel 0

# Miscellaneous
SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping 20127
SecStatusEngine On

# =====================
# CRS Exclusions for ettametta API
# =====================

# Allow JSON content types for API
SecRule REQUEST_HEADERS:Content-Type "application/json" \
    "id:1000,phase:1,pass,nolog,ctl:ruleRemoveById=200002"

# Allow webhook callbacks (e.g., social media OAuth)
SecRule REQUEST_URI "@beginsWith /api/webhooks/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Allow large payloads for video uploads
SecRule REQUEST_URI "@beginsWith /api/videos/upload" \
    "id:1002,phase:1,pass,nolog,ctl:RequestBodyAccess=Off"

# =====================
# Custom Rules
# =====================

# Block SQL injection attempts in query strings
SecRule ARGS|ARGS_NAMES|REQUEST_URI \
    "@rx (?i)(?:union\s+(?:all\s+)?select|select\s+.*\s+from|insert\s+into|delete\s+from|drop\s+table|update\s+.*\s+set)" \
    "id:2000,phase:2,block,log,msg:'SQL Injection Detected',tag:'attack-sqli',severity:2"

# Block common scanner tools
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile scanners-user-agents.data" \
    "id:2001,phase:1,block,log,msg:'Known Scanner Detected',tag:'attack-scanner',severity:2"

# Block directory traversal
SecRule REQUEST_URI|ARGS|ARGS_NAMES \
    "@rx (?:\.\./|\.\.\\|%2e%2e%2f|%2e%2e/|\.%2e/|%2e\.%2f)" \
    "id:2002,phase:2,block,log,msg:'Directory Traversal Detected',tag:'attack-lfi',severity:2"

# Rate limit exceeded response
SecRule IP:REQ_COUNT "@gt 1000" \
    "id:2003,phase:1,drop,log,msg:'Rate Limit Exceeded',tag:'attack-dos',severity:2"
