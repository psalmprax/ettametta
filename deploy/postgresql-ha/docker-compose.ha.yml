version: "3.8"

services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: pg-primary
    hostname: pg-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ettametta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ettametta}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./primary-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - pg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ettametta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
        -c hot_standby=on
        -c wal_keep_size=1024
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB

  postgres-replica-1:
    image: postgres:15-alpine
    container_name: pg-replica-1
    hostname: pg-replica-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ettametta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-replica1-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pg-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ettametta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica-2:
    image: postgres:15-alpine
    container_name: pg-replica-2
    hostname: pg-replica-2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ettametta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-replica2-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - pg-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ettametta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres:///${POSTGRES_DB:-ettametta}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
    ports:
      - "6432:6432"
    networks:
      - pg-net
    depends_on:
      postgres-primary:
        condition: service_healthy

volumes:
  pg-primary-data:
  pg-replica1-data:
  pg-replica2-data:

networks:
  pg-net:
    driver: bridge
