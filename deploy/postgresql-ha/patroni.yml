scope: ettametta-pg-cluster
name: ${HOSTNAME:-pg-node1}

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${HOSTNAME:-pg-node1}:8008
  authentication:
    username: patroni
    password: ${PATRONI_PASSWORD:-changeme}

etcd3:
  hosts: ${ETCD_HOSTS:-etcd1:2379,etcd2:2379,etcd3:2379}

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        max_wal_senders: 5
        max_replication_slots: 5
        hot_standby: "on"
        wal_keep_size: 1024
        max_connections: 200
        shared_buffers: 256MB
        effective_cache_size: 768MB
        work_mem: 16MB
        maintenance_work_mem: 128MB

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

  users:
    admin:
      password: ${POSTGRES_PASSWORD:-changeme}
      options:
        - createrole
        - createdb

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${HOSTNAME:-pg-node1}:5432
  data_dir: /var/lib/postgresql/data/pgdata
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: ${POSTGRES_PASSWORD:-changeme}
    superuser:
      username: postgres
      password: ${POSTGRES_PASSWORD:-changeme}
  parameters:
    unix_socket_directories: '/var/run/postgresql'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
