version: "3.8"

services:
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8501:8501"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data
      - ./consul.hcl:/consul/config/consul.hcl:ro
    command: agent -config-dir=/consul/config
    networks:
      - consul-net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul-ui:
    image: hashicorp/consul:1.17
    container_name: consul-ui
    restart: unless-stopped
    command: ui -http-addr=http://consul:8500
    ports:
      - "8502:8500"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - consul-net

  registrator:
    image: gliderlabs/registrator:latest
    container_name: registrator
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock
    command: -internal consul://consul:8500
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - consul-net

volumes:
  consul-data:

networks:
  consul-net:
    driver: bridge
