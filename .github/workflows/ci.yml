name: CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd src/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock
          
      - name: Run all tests with coverage
        run: |
          cd src/api
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=60
        env:
          GROQ_API_KEY: test_key
          ENV: development

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: src/api/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          
      - name: Run linting
        run: |
          pip install ruff
          ruff check api/
          
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security scan
        run: |
          pip install safety bandit
          cd src/api
          safety check --json > security_report.json || true
          bandit -r . -f json -o bandit_report.json || true
          
  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate script syntax (bash -n)
        run: |
          echo 'Checking setup-server.sh...'
          bash -n scripts/setup-server.sh && echo 'PASS: setup-server.sh' || { echo 'FAIL: setup-server.sh'; exit 1; }
          echo 'Checking generate-env.sh...'
          bash -n scripts/generate-env.sh && echo 'PASS: generate-env.sh' || { echo 'FAIL: generate-env.sh'; exit 1; }

      - name: Dry-run .env generator
        run: |
          echo 'Running generate-env.sh --dry-run...'
          bash scripts/generate-env.sh --dry-run || { echo 'FAIL: generate-env.sh dry-run'; exit 1; }

      - name: Install and run shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          echo 'Linting setup-server.sh...'
          shellcheck -e SC1091 scripts/setup-server.sh
          echo 'Linting generate-env.sh...'
          shellcheck -e SC1091 scripts/generate-env.sh

  build:
    runs-on: ubuntu-latest
    needs: [test, security, shell-scripts]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
        run: |
          docker compose build api
          docker build -f apps/dashboard/Dockerfile ./apps/dashboard

      - name: Start services
        run: |
          docker compose up -d
          docker compose ps

      - name: Run alembic migrations
        run: |
          sleep 5
          docker compose exec -T api alembic upgrade head || \
            docker compose run --rm -T api alembic upgrade head

      - name: Wait for API health
        run: |
          echo 'Waiting for API to become healthy...'
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7201/health; then
              echo ''
              echo 'API is healthy'
              break
            fi
            [ "$i" -eq 60 ] && echo 'WARNING: API health check timed out' || true
            sleep 1
          done
          curl -s -o /dev/null -w 'API docs: %{http_code}\n' http://localhost:7201/docs || true
          docker compose ps
          
      - name: Set up Node.js for E2E
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install E2E dependencies
        run: |
          cd src/tests/e2e
          npm install
          npx playwright install --with-deps chromium
          
      - name: Run all E2E tests (GitHub Actions)
        run: |
          cd src/tests/e2e
          # Run against the Docker-compose stack
          npx playwright test
        env:
          BASE_URL: http://localhost:3000

      - name: Run Nexus Engine E2E tests (dedicated)
        run: |
          cd src/tests/e2e
          npx playwright test tests/nexus/ --project=chromium --timeout=300000
        env:
          BASE_URL: http://localhost:3000

      - name: Run Agent Zero E2E tests (dedicated)
        run: |
          cd src/tests/e2e
          npx playwright test tests/autonomous/ --project=chromium --timeout=300000
        env:
          BASE_URL: http://localhost:3000

      - name: Cleanup
        if: always()
        run: |
          docker compose down
