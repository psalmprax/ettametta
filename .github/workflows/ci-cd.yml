name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 curl tesseract-ocr libtesseract-dev chromium libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r src/api/requirements.txt
        pip install pytest pytest-asyncio pytest-mock pytest-cov

    - name: Run database migrations
      run: |
        python -c "
        from src.api.utils.database import engine
        from src.api.utils.models import Base
        Base.metadata.create_all(bind=engine)
        print('Database migrations completed')
        "

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/1
        PYTHONPATH: .
      run: |
        pytest src/api/tests/ -v --cov=src/api --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r src/api/ -f json -o bandit-report.json || true
        cat bandit-report.json

    - name: Run Safety dependency scan
      run: |
        pip install safety
        safety check --full-report || true

  e2e-tests:
    needs: [test, security-scan]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install E2E dependencies
      run: |
        cd src/tests/e2e
        npm install
        npx playwright install --with-deps chromium

    - name: Start Docker Compose stack
      run: |
        docker compose up -d
        # Wait for services to be healthy
        sleep 20
        docker compose ps
        # Verify both API and dashboard are reachable
        curl -s -o /dev/null -w "API: %{http_code}\n" http://localhost:8000/api/health || echo "API health check endpoint not found, trying dashboard..."
        curl -s -o /dev/null -w "Dashboard: %{http_code}\n" http://localhost:3000

    - name: Run Nexus Engine E2E tests
      run: |
        cd src/tests/e2e
        npx playwright test tests/nexus/ --project=chromium --timeout=300000 --reporter=list
      env:
        BASE_URL: http://localhost:3000

    - name: Run Agent Zero E2E tests
      run: |
        cd src/tests/e2e
        npx playwright test tests/autonomous/ --project=chromium --timeout=300000 --reporter=list
      env:
        BASE_URL: http://localhost:3000

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: |
          src/tests/e2e/test-results/
          src/tests/e2e/playwright-report/
        retention-days: 7

  deploy:
    needs: [test, security-scan, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        ssh -o StrictHostKeyChecking=no -i private_key.pem $SSH_USER@$SSH_HOST << 'EOF'
          cd /root/ettametta
          git pull origin master
          docker compose down
          docker compose up -d --build
          docker compose logs -f --tail=50
        EOF
